
# Canada Tech Intelligence — DEV Terraform Deployment
#
# Trigger: Approved PR merged into develop.
# Environment: dev
# AWS Account: 959856141465
# Region: ca-central-1
#
# Terraform Plan -> Check -> Apply
# Destructive changes are blocked.
# GitHub OIDC authentication.

name: Terraform DEV

on:
  push:
    branches: [develop]
    paths:
      - 'infrastructure/envs/dev/**'
      - 'infrastructure/modules/**'
      - '.github/workflows/terraform-dev.yml'

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: ca-central-1
  AWS_ACCOUNT_ID: '959856141465'

jobs:
  deploy:
    name: Terraform Apply (DEV)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infrastructure/envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform Root
        run: |
          test -f main.tf
          test -f backend.tf

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cti-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '959856141465'

      - name: Verify AWS Account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACCOUNT" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Incorrect AWS account."
            exit 1
          fi

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -lockfile=readonly -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          set +e

          terraform plan \
            -no-color \
            -input=false \
            -detailed-exitcode \
            -out=tfplan

          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Terraform plan failed."
            exit 1
          fi

      - name: Review Plan and Block Destruction
        run: |
          terraform show -json tfplan | jq -r '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"])
              | {
                  address: .address,
                  actions: .change.actions
                }
            ] as $changes
            |
            "## CTI Terraform DEV Plan",
            "",
            "### Resource changes",
            (
              if ($changes | length) == 0 then
                "No infrastructure changes."
              else
                (
                  $changes[]
                  | "- `\(.actions | join(", "))`: `\(.address)`"
                )
              end
            )
          ' >> "$GITHUB_STEP_SUMMARY"

          terraform show -json tfplan | jq -e '
            [
              .resource_changes[]?
              | select(
                  (.change.actions | index("delete")) != null
                )
            ] | length == 0
          ' > /dev/null || {
            echo "::error::Destructive changes are blocked."
            exit 1
          }

      - name: Terraform Apply
        if: steps.plan.outputs.changes == 'true'
        run: terraform apply -no-color -input=false tfplan

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## CTI DEV Deployment"
            echo "Environment: dev"
            echo "AWS Account: $AWS_ACCOUNT_ID"
            echo "Result: Successful"
          } >> "$GITHUB_STEP_SUMMARY"


