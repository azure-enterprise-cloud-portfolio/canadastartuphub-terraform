
# CTI Terraform PR Validation and Plan
#
# PR to develop -> Dev AWS account
# PR to main    -> Prod AWS account
#
# No terraform apply.
# Plans are for review only.

name: Terraform PR

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'infrastructure/**'
      - 'bootstrap/**'
      - '.github/workflows/terraform-pr.yml'

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: ca-central-1

jobs:
  validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: bash infrastructure/scripts/validate.sh

  plan:
    name: Terraform Plan
    needs: validate

    # Do not grant AWS credentials to forked pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: pr-plan

    permissions:
      contents: read
      id-token: write

    env:
      TF_ROOT: ${{ github.base_ref == 'main' && 'infrastructure/envs/prod' || 'infrastructure/envs/dev' }}
      EXPECTED_ACCOUNT: ${{ github.base_ref == 'main' && '285034436054' || '959856141465' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Terraform Root
        run: |
          if [ ! -f "$TF_ROOT/backend.tf" ]; then
            echo "::error::Missing Terraform root: $TF_ROOT"
            exit 1
          fi

      - name: Configure AWS Plan Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.base_ref == 'main' && vars.AWS_PLAN_ROLE_ARN_PROD || vars.AWS_PLAN_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT }}

      - name: Verify AWS Account
        run: |
          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Incorrect AWS account"
            exit 1
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set +e

          terraform plan \
            -lock=false \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -out=tfplan

          code=$?
          set -e

          if [ "$code" -eq 1 ]; then
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Terraform Plan Summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          {
            echo "## CTI Terraform PR Plan"
            echo ""
            echo "Target: ${{ github.base_ref }}"
            echo "AWS Account: $EXPECTED_ACCOUNT"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          terraform show -json tfplan | jq -r '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"])
              | {
                  address: .address,
                  actions: .change.actions
                }
            ] as $changes
            |
            "### Planned resource changes",
            "",
            "Create: \(
              [$changes[] | select(.actions == ["create"])]
              | length
            )",
            "Update: \(
              [$changes[] | select(.actions == ["update"])]
              | length
            )",
            "Delete or replace: \(
              [$changes[]
                | select(.actions | index("delete"))]
              | length
            )",
            "",
            "### Resource actions",
            "",
            (
              if ($changes | length) == 0 then
                "No resource changes."
              else
                (
                  $changes[]
                  | "- `\(.actions | join(", "))`: `\(.address)`"
                )
              end
            )
          ' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review only — no apply performed." \
            >> "$GITHUB_STEP_SUMMARY"

