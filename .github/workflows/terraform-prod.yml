# Canada Tech Intelligence — Production Terraform
#
# Release process:
#   1. DEV deployment succeeds.
#   2. Approved PR from develop is merged into main.
#   3. Production Terraform plan runs.
#   4. Reviewer approves production deployment.
#   5. Terraform applies the saved plan.
#
# PR-only merging and DEV-success verification
# must be enforced before changes reach main.
#
# AWS Account: 285034436054
# GitHub Environment: prod
# Region: ca-central-1

name: Terraform PROD

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/envs/prod/**'
      - 'infrastructure/modules/**'
      - '.github/workflows/terraform-prod.yml'

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: ca-central-1
  AWS_ACCOUNT_ID: '285034436054'

jobs:
  plan:
    name: Terraform Plan (PROD)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    outputs:
      changes: ${{ steps.plan.outputs.changes }}

    defaults:
      run:
        working-directory: infrastructure/envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Backend Configuration
        run: |
          test -f backend.tf
          ls *.tf > /dev/null

          if grep -q 'REPLACE_WITH_STATE_BUCKET_NAME' backend.tf; then
            echo "::error::Production backend not configured."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Plan Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN_PROD }}
          role-session-name: cti-prod-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Account
        run: |
          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACCOUNT" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Incorrect AWS account."
            exit 1
          fi

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -lock=false \
            -no-color \
            -detailed-exitcode \
            -out=tfplan

          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Terraform plan failed."
            exit 1
          fi

      - name: Review Plan and Block Destruction
        run: |
          terraform show -json tfplan | jq -r '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"])
              | {
                  address: .address,
                  actions: .change.actions
                }
            ] as $changes
            |
            "## CTI Production Terraform Plan",
            "",
            "AWS Account: 285034436054",
            "Environment: prod",
            "",
            "### Resource changes",
            "",
            (
              if ($changes | length) == 0 then
                "No infrastructure changes."
              else
                (
                  $changes[]
                  | "- `\(.actions | join(", "))`: `\(.address)`"
                )
              end
            )
          ' >> "$GITHUB_STEP_SUMMARY"

          if ! terraform show -json tfplan | jq -e '
            [
              .resource_changes[]?
              | select(
                  (.change.actions | index("delete")) != null
                )
            ] | length == 0
          ' > /dev/null; then
            echo "::error::Destructive changes blocked."
            exit 1
          fi

      - name: Upload Terraform Plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cti-prod-tfplan
          path: infrastructure/envs/prod/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform Apply (PROD)
    needs: plan
    if: needs.plan.outputs.changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Protected production environment.
    environment: prod

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infrastructure/envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Deploy Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cti-prod-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Account
        run: |
          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACCOUNT" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Incorrect AWS account."
            exit 1
          fi

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Download Approved Plan
        uses: actions/download-artifact@v4
        with:
          name: cti-prod-tfplan
          path: infrastructure/envs/prod

      - name: Terraform Apply
        run: terraform apply -no-color -input=false tfplan

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## CTI Production Deployment"
            echo ""
            echo "Environment: prod"
            echo "AWS Account: $AWS_ACCOUNT_ID"
            echo "Result: Successfully applied"
          } >> "$GITHUB_STEP_SUMMARY"
