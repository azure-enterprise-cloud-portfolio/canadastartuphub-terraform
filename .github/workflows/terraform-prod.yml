
# ============================================================
# Canada Tech Intelligence — Production Terraform
# ============================================================
#
# Release process:
# 1. DEV deployment succeeds.
# 2. Approved PR from develop is merged into main.
# 3. Production Terraform plan runs.
# 4. Reviewer approves production deployment.
# 5. Terraform applies the saved plan.
#
# PR-only merging and DEV-success verification must be
# enforced through GitHub branch protection and CI.
#
# AWS Account: 285034436054
# GitHub Environment: prod
# Region: ca-central-1
# ============================================================

name: Terraform PROD

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/envs/prod/**'
      - 'infrastructure/modules/**'
      - '.github/workflows/terraform-prod.yml'

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: ca-central-1
  AWS_ACCOUNT_ID: '285034436054'

jobs:

  # ==========================================================
  # 1. Terraform Production Plan
  # ==========================================================

  plan:
    name: Terraform Plan (PROD)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Production Google and LinkedIn repository secrets.
    env:
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID_PROD }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET_PROD }}

      TF_VAR_linkedin_client_id: ${{ secrets.PROD_LINKEDIN_CLIENT_ID }}
      TF_VAR_linkedin_client_secret: ${{ secrets.PROD_LINKEDIN_CLIENT_SECRET }}

    permissions:
      contents: read
      id-token: write

    outputs:
      changes: ${{ steps.plan.outputs.changes }}

    defaults:
      run:
        working-directory: infrastructure/envs/prod

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------
      # 2. Verify Google OAuth credentials
      # ------------------------------------------------------

      - name: Verify Google OAuth Credentials
        shell: bash
        run: |
          if [[ -z "${TF_VAR_google_client_id//[[:space:]]/}" ]]; then
            echo "::error::GOOGLE_CLIENT_ID_PROD is missing or empty."
            exit 1
          fi

          if [[ -z "${TF_VAR_google_client_secret//[[:space:]]/}" ]]; then
            echo "::error::GOOGLE_CLIENT_SECRET_PROD is missing or empty."
            exit 1
          fi

          echo "Production Google OAuth credentials are configured."

      # ------------------------------------------------------
      # 3. Verify LinkedIn OIDC credentials
      # ------------------------------------------------------
      #
      # Check credentials directly rather than relying on
      # grep against terraform.tfvars.
      #
      # Never print credential values.
      # ------------------------------------------------------

      - name: Verify LinkedIn OIDC Credentials
        shell: bash
        run: |
          if [[ -z "${TF_VAR_linkedin_client_id//[[:space:]]/}" ]]; then
            echo "::error::PROD_LINKEDIN_CLIENT_ID is missing or empty."
            exit 1
          fi

          if [[ -z "${TF_VAR_linkedin_client_secret//[[:space:]]/}" ]]; then
            echo "::error::PROD_LINKEDIN_CLIENT_SECRET is missing or empty."
            exit 1
          fi

          echo "Production LinkedIn OIDC credentials are configured."

      # ------------------------------------------------------
      # 4. Check Terraform backend configuration
      # ------------------------------------------------------

      - name: Check Backend Configuration
        shell: bash
        run: |
          test -f backend.tf
          ls *.tf > /dev/null

          if grep -q 'REPLACE_WITH_STATE_BUCKET_NAME' backend.tf; then
            echo "::error::Production backend not configured."
            exit 1
          fi

          echo "Production Terraform backend configuration found."

      # ------------------------------------------------------
      # 5. Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ------------------------------------------------------
      # 6. Configure AWS credentials using GitHub OIDC
      # ------------------------------------------------------

      - name: Configure AWS Plan Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN_PROD }}
          role-session-name: cti-prod-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # 7. Verify production AWS account
      # ------------------------------------------------------

      - name: Verify AWS Account
        shell: bash
        run: |
          ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [[ "$ACCOUNT" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Incorrect AWS account."
            exit 1
          fi

          echo "Verified CTI production AWS account."

      # ------------------------------------------------------
      # 8. Terraform formatting
      # ------------------------------------------------------

      - name: Terraform Format
        run: terraform fmt -check -recursive

      # ------------------------------------------------------
      # 9. Terraform initialization
      # ------------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      # ------------------------------------------------------
      # 10. Terraform validation
      # ------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate -no-color

      # ------------------------------------------------------
      # 11. Terraform plan
      # ------------------------------------------------------
      #
      # State locking remains enabled.
      # Terraform exits:
      # 0 = no changes
      # 1 = error
      # 2 = changes present
      # ------------------------------------------------------

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -detailed-exitcode \
            -out=tfplan

          code=$?
          set -e

          if [[ "$code" -eq 0 ]]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"

          elif [[ "$code" -eq 2 ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"

          else
            echo "::error::Production Terraform plan failed."
            exit 1
          fi

      # ------------------------------------------------------
      # 12. Review plan and block destruction
      # ------------------------------------------------------

      - name: Review Plan and Block Destruction
        shell: bash
        run: |
          terraform show -json tfplan | jq -r '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"])
              | {
                  address: .address,
                  actions: .change.actions
                }
            ] as $changes
            |
            "## CTI Production Terraform Plan",
            "",
            "AWS Account: 285034436054",
            "Environment: prod",
            "",
            "### Resource changes",
            "",
            (
              if ($changes | length) == 0 then
                "No infrastructure changes."
              else
                (
                  $changes[]
                  | "- `\(.actions | join(", "))`: `\(.address)`"
                )
              end
            )
          ' >> "$GITHUB_STEP_SUMMARY"

          if ! terraform show -json tfplan | jq -e '
            [
              .resource_changes[]?
              | select(
                  (.change.actions | index("delete")) != null
                )
            ] | length == 0
          ' > /dev/null; then
            echo "::error::Destructive changes blocked."
            exit 1
          fi

          echo "Production Terraform plan passed destruction checks."

      # ------------------------------------------------------
      # 13. Upload saved Terraform plan
      # ------------------------------------------------------
      #
      # Terraform saved plans can contain sensitive values.
      # Restrict repository/artifact access.
      # ------------------------------------------------------

      - name: Upload Terraform Plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cti-prod-tfplan
          path: infrastructure/envs/prod/tfplan
          retention-days: 1
          if-no-files-found: error

  # ==========================================================
  # 2. Terraform Production Apply
  # ==========================================================

  apply:
    name: Terraform Apply (PROD)
    needs: plan

    if: needs.plan.outputs.changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Requires GitHub environment protection rules to
    # enforce manual approval.
    environment: prod

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infrastructure/envs/prod

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------
      # 2. Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ------------------------------------------------------
      # 3. Configure AWS deploy credentials
      # ------------------------------------------------------

      - name: Configure AWS Deploy Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cti-prod-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # 4. Verify production AWS account
      # ------------------------------------------------------

      - name: Verify AWS Account
        shell: bash
        run: |
          ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [[ "$ACCOUNT" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Incorrect AWS account."
            exit 1
          fi

          echo "Verified CTI production AWS account."

      # ------------------------------------------------------
      # 5. Terraform init
      # ------------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      # ------------------------------------------------------
      # 6. Download saved Terraform plan
      # ------------------------------------------------------

      - name: Download Approved Plan
        uses: actions/download-artifact@v4
        with:
          name: cti-prod-tfplan
          path: infrastructure/envs/prod

      # ------------------------------------------------------
      # 7. Terraform apply
      # ------------------------------------------------------

      - name: Terraform Apply
        shell: bash
        run: terraform apply -no-color -input=false tfplan

      # ------------------------------------------------------
      # 8. Deployment summary
      # ------------------------------------------------------

      - name: Deployment Summary
        if: success()
        shell: bash
        run: |
          {
            echo "## CTI Production Deployment"
            echo ""
            echo "Environment: prod"
            echo "AWS Account: $AWS_ACCOUNT_ID"
            echo ""
            echo "Result: Terraform applied successfully."
          } >> "$GITHUB_STEP_SUMMARY"

